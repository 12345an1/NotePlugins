# Codex 0.160.1 hooks —— 模板配置（发布版不含任何本机绝对路径）。
#
# 关键：每个事件的值是「匹配组」数组，匹配组里再套一个 `hooks` 数组；
# handler 通过 `type = "command"` 标记。不要把 type/command/timeout 直接写在
# 事件数组里，否则会被 MatcherGroup 反序列化时静默丢弃（0 个 handler，
# hook 不触发、也不报错）。
#
# 0.160.1 可配置的事件：PreToolUse / PermissionRequest / PostToolUse /
# PreCompact / PostCompact / SessionStart / SessionEnd / SubagentStart /
# SubagentStop / Interrupt（没有 Stop、UserPromptSubmit）。
#
# 路径用 ${PLUGIN_ROOT} 指向插件根目录（与插件的 hooks/hooks.json 一致）。
# 注意：
#   1. 插件方式的钩子以 hooks/hooks.json 为准；本文件是「项目级」钩子模板，
#      供把仓库直接当项目使用时参考。
#   2. 如果你的 Codex 在项目级 [hooks] 里不展开 ${PLUGIN_ROOT}，请把它替换成
#      你机器上的绝对路径，或直接依赖插件的 hooks/hooks.json（推荐）。
#   3. 首次启用会要求信任这些命令；改过命令后信任会失效，需要重新信任。

[hooks]

[[hooks.Interrupt]]
[[hooks.Interrupt.hooks]]
type = "command"
command = "python3 \"${PLUGIN_ROOT}/skills/pause-resume-checkpoint/scripts/save_progress.py\""
async = true
timeout = 30
additionalContextLimit = 10000

# Early warning for the payload limit: Codex compacts when the context is
# getting large, i.e. the moment just before a request is most likely to fail
# with "Payload Too Large: Failed to buffer the request body". Snapshot progress
# before compaction so an aborted turn never loses the checkpoint.
[[hooks.PreCompact]]
[[hooks.PreCompact.hooks]]
type = "command"
command = "python3 \"${PLUGIN_ROOT}/skills/pause-resume-checkpoint/scripts/save_progress.py\""
async = true
timeout = 30
additionalContextLimit = 10000

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "python3 \"${PLUGIN_ROOT}/skills/pause-resume-checkpoint/scripts/session_end.py\""
timeout = 30
additionalContextLimit = 10000

[[hooks.PostToolUse]]
matcher = "shell|local_shell|exec_command|Bash"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 \"${PLUGIN_ROOT}/skills/pause-resume-checkpoint/scripts/cleanup_completed_runs.py\""
async = true
timeout = 180
additionalContextLimit = 10000
