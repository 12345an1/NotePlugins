[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "note-postprocess"
version = "0.1.0"
description = "Codex skill and scripts for cleaning up drafted Obsidian course notes."
readme = "SKILL.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
py-modules = []
